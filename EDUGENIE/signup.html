<!DOCTYPE html>
<html>
<head>

    <title>EduGenie AI - Sign Up</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f6ff;
            margin: 0;
        }

        header {
            background: #4b6cff;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 350px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }

        h2 {
            text-align: center;
            color: #4b6cff;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4b6cff;
            color: white;
            border: none;
            border-radius: 8px;
        }

        #error {
            color: red;
            text-align: center;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #4b6cff;
            text-decoration: none;
        }

    </style>

</head>

<body>

<header>
    <h1>🎓 EduGenie AI</h1>
</header>

<div class="container">

    <h2>Create Account</h2>

    <form action="signup.php"
          method="post"
          onsubmit="return validateForm()">

        <input type="text"
               name="name"
               placeholder="Enter Name"
               required>

        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>

        <input type="password"
               id="password"
               name="password"
               placeholder="Enter Password"
               required>

        <input type="password"
               id="confirm_password"
               name="confirm_password"
               placeholder="Confirm Password"
               required>

        <button type="submit">
            Sign Up
        </button>

    </form>

    <p id="error"></p>

    <div class="links">

        <p>Already have an account?</p>

        <a href="loginpage.html">
            Login
        </a>

        <br><br>

        <a href="index.html">
            ⬅ Back to Home
        </a>

    </div>

</div>

<script>

function validateForm() {

    let password =
        document.getElementById("password").value;

    let confirmPassword =
        document.getElementById("confirm_password").value;

    if (password !== confirmPassword) {

        document.getElementById("error").innerHTML =
            "Passwords do not match.";

        return false;
    }

    if (password.length < 6) {

        document.getElementById("error").innerHTML =
            "Password must be at least 6 characters.";

        return false;
    }

    return true;
}

</script>

</body>
</html>
