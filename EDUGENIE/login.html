<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EduGenie AI - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            margin: 0;
        }

        header {
            background: #4b6cff;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 350px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }

        h2 {
            text-align: center;
            color: #4b6cff;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4b6cff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #4b6cff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1> EduGenie AI</h1>
</header>

<div class="container">

    <h2>Login</h2>

    <form action="dashboard.html" method="get">

        <input
            type="email"
            name="email"
            placeholder="Enter Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="links">

        <p>Don't have an account?</p>

        <a href="signuppage.html">
            Create New Account
        </a>

        <br><br>

        <a href="index.html">
            ⬅ Back to Home
        </a>

    </div>

</div>

</body>
</html>
