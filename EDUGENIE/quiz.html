<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EduGenie AI - Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            margin: 0;
        }

        header {
            background: #4b6cff;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .quiz-box {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }

        h2 {
            color: #4b6cff;
        }

        .option {
            display: block;
            background: #eef2ff;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .option:hover {
            background: #dce3ff;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #4b6cff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .correct {
            background: #d4edda;
            color: #155724;
        }

        .wrong {
            background: #f8d7da;
            color: #721c24;
        }

        .score {
            text-align: center;
            color: #4b6cff;
            font-size: 22px;
            font-weight: bold;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4b6cff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1> EduGenie AI Quiz</h1>
    <p>Test Your Knowledge</p>
</header>

<div class="quiz-box">

    <div id="questionNumber"></div>

    <h2 id="question"></h2>

    <div id="options"></div>

    <button onclick="checkAnswer()">Next</button>

    <div id="result"></div>

</div>

<script>

const questions = [

    {
        question: "1. Which language is used to create a webpage?",
        options: ["HTML", "CSS", "Python", "MySQL"],
        answer: "HTML"
    },

    {
        question: "2. Which language is used to style a webpage?",
        options: ["HTML", "CSS", "PHP", "Python"],
        answer: "CSS"
    },

    {
        question: "3. Which language makes webpages interactive?",
        options: ["HTML", "CSS", "JavaScript", "MySQL"],
        answer: "JavaScript"
    },

    {
        question: "4. What does HTML stand for?",
        options: [
            "Hyper Text Markup Language",
            "High Text Machine Language",
            "Hyper Tool Markup Language",
            "Home Text Markup Language"
        ],
        answer: "Hyper Text Markup Language"
    },

    {
        question: "5. Which HTML tag is used to create a paragraph?",
        options: ["<h1>", "<p>", "<br>", "<div>"],
        answer: "<p>"
    },

    {
        question: "6. Which HTML tag is used to create the largest heading?",
        options: ["<h6>", "<head>", "<h1>", "<heading>"],
        answer: "<h1>"
    },

    {
        question: "7. Which software can be used to write code?",
        options: ["VS Code", "Calculator", "Paint", "Music Player"],
        answer: "VS Code"
    },

    {
        question: "8. Which database is commonly used with PHP?",
        options: ["MySQL", "HTML", "CSS", "JavaScript"],
        answer: "MySQL"
    },

    {
        question: "9. What does CSS stand for?",
        options: [
            "Cascading Style Sheets",
            "Computer Style System",
            "Creative Style Sheets",
            "Colorful Style Sheets"
        ],
        answer: "Cascading Style Sheets"
    },

    {
        question: "10. Which symbol is used for an ID selector in CSS?",
        options: [".", "#", "*", "$"],
        answer: "#"
    }

];

let currentQuestion = 0;
let score = 0;

function loadQuestion() {

    document.getElementById("result").innerHTML = "";

    document.getElementById("questionNumber").innerHTML =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    document.getElementById("question").innerHTML =
        questions[currentQuestion].question;

    let optionsHTML = "";

    questions[currentQuestion].options.forEach(function(option, index) {

        optionsHTML += `
            <label class="option">
                <input type="radio" name="answer" value="${option}">
                ${option}
            </label>
        `;

    });

    document.getElementById("options").innerHTML = optionsHTML;
}


function checkAnswer() {

    let selected = document.querySelector(
        'input[name="answer"]:checked'
    );

    if (!selected) {
        alert("Please select an answer!");
        return;
    }

    let correctAnswer = questions[currentQuestion].answer;

    if (selected.value === correctAnswer) {

        score++;

        document.getElementById("result").innerHTML =
            "Correct Answer ✅";

        document.getElementById("result").className = "correct";

    } else {

        document.getElementById("result").innerHTML =
            "Wrong Answer ❌<br>Correct Answer: " + correctAnswer;

        document.getElementById("result").className = "wrong";
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {

        setTimeout(function() {
            loadQuestion();
        }, 800);

    } else {

        setTimeout(function() {
            showResult();
        }, 800);

    }
}


function showResult() {

    document.querySelector(".quiz-box").innerHTML = `

        <div class="score">
            🎉 Quiz Completed!
        </div>

        <h2 style="text-align:center;">
            Your Score: ${score} / ${questions.length}
        </h2>

        <p style="text-align:center;">
            You answered ${score} questions correctly.
        </p>

        <button onclick="location.reload()">
            🔄 Try Again
        </button>

        <a class="home" href="dashboard.html">
            ⬅ Back to Dashboard
        </a>

    `;
}


loadQuestion();

</script>

</body>
</html>
